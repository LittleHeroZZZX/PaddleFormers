### data
train_dataset_type: erniekit
eval_dataset_type: erniekit
train_dataset_path: ./examples/data/train.json
train_dataset_prob: "1.0"
eval_dataset_path: ./examples/data/dev.json
eval_dataset_prob: "1.0"
max_seq_len: 1024
num_samples_each_epoch: 6000000
packing: false
mix_strategy: concat

### model
model_name_or_path: LLM-Research/Llama-3.2-1B-Instruct
# model_name_or_path: Qwen/Qwen3-0.6B-Base
attn_impl: flashmask

### finetuning
# base
seed: 23
do_train: true
do_eval: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 2
# num_train_epochs: 1
max_steps: 200
# eval_steps: 1
eval_steps: 10
evaluation_strategy: steps
save_steps: 500
save_total_limit: 1
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 4
logging_dir: ./vdl_log
output_dir: ./checkpoints/llama3-sft/1epoch
disable_tqdm: true
eval_accumulation_steps: 16

# train
warmup_steps: 20
learning_rate: 1.0e-5

# performance
tensor_parallel_degree: 1
pipeline_parallel_degree: 1
sharding: stage1
recompute: true
bf16: true
fp16_opt_level: O2
unified_checkpoint: true

random_shuffle: false